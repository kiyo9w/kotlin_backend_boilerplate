# the service server + Postgres, one target a single person can operate.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# The named volume keeps the database across `down`; `down -v` is the
# destructive reset and asks first. Secrets come from a gitignored `.env` beside
# this file (deploy/.env) or the host environment — never from this file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myproduct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-myproduct}
    volumes:
      - myproduct-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myproduct} -d ${POSTGRES_DB:-myproduct}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myproduct}
      DATABASE_USER: ${POSTGRES_USER:-myproduct}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE: ${MODEL_BASE:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      APP_DAILY_SEED_CAP: ${APP_DAILY_SEED_CAP:-24}
      APP_DAILY_TALK_CAP: ${APP_DAILY_TALK_CAP:-120}
      APP_FACTORY_KILL: ${APP_FACTORY_KILL:-}
      APP_STORE_EVENTS_TRUST_UNVERIFIED: ${APP_STORE_EVENTS_TRUST_UNVERIFIED:-false}
      APPLE_ROOT_CA_PEM: ${APPLE_ROOT_CA_PEM:-}
      APPLE_ROOT_CA_PATH: ${APPLE_ROOT_CA_PATH:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  myproduct-postgres:
    name: myproduct-postgres
