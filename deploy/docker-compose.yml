# the service server + Postgres, one target a single person can operate.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# The named volume keeps the database across `down`; `down -v` is the
# destructive reset and asks first. Secrets come from a gitignored `.env` beside
# this file (deploy/.env) or the host environment — never from this file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qoloa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-qoloa}
    volumes:
      - qoloa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qoloa} -d ${POSTGRES_DB:-qoloa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-qoloa}
      DATABASE_USER: ${POSTGRES_USER:-qoloa}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      CMD_API_KEY: ${CMD_API_KEY:-}
      CMD_BASE: ${CMD_BASE:-https://api.commandcode.ai/provider/v1}
      CMD_MODEL: ${CMD_MODEL:-meta/muse-spark-1.2-contributor}
      QOLOA_DAILY_SEED_CAP: ${QOLOA_DAILY_SEED_CAP:-24}
      QOLOA_DAILY_TALK_CAP: ${QOLOA_DAILY_TALK_CAP:-120}
      QOLOA_FACTORY_KILL: ${QOLOA_FACTORY_KILL:-}
      QOLOA_STORE_EVENTS_TRUST_UNVERIFIED: ${QOLOA_STORE_EVENTS_TRUST_UNVERIFIED:-false}
      QOLOA_APPLE_ROOT_CA_PEM: ${QOLOA_APPLE_ROOT_CA_PEM:-}
      QOLOA_APPLE_ROOT_CA_PATH: ${QOLOA_APPLE_ROOT_CA_PATH:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  qoloa-postgres:
    name: qoloa-postgres
