# the service server — nginx reverse proxy.
#
# One site, one upstream, TLS terminated here (certificate paths from certbot).
# The server sets its own security headers and caps; this file adds only what a
# proxy must: buffering limits, timeouts, the real client address, and the
# correlation id.

upstream qoloa_server {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    # Redirect everything to HTTPS once a certificate exists.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Point these at the certificate certbot issued for the real host.
    ssl_certificate     /etc/letsencrypt/live/qoloa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qoloa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The server bounds request bodies at 200 KB; allow headroom, not megabytes.
    client_max_body_size 1m;

    # Do not let a slow client hold a worker open indefinitely.
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    location / {
        proxy_pass http://qoloa_server;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Correlation id: pass an inbound one through, otherwise the server
        # generates it. Never strip it.
        proxy_set_header X-Request-Id $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Readiness for the load balancer, on the loopback interface only.
    location = /ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://qoloa_server;
    }
}
