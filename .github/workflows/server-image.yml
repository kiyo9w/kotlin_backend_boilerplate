# Build the server image on every relevant push and verify it starts healthy.
#
# This workflow builds and smoke-tests the image; it does not touch a live
# host. A real deploy is `deploy/deploy.sh` on the target, run by a person.

name: server-image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/server-image.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t boilerplate-server:ci .

      - name: Start image and wait for /health
        run: |
          docker run -d --name boilerplate-ci -p 8080:8080 boilerplate-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "health ok after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy" >&2
          docker logs boilerplate-ci >&2 || true
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f boilerplate-ci || true
